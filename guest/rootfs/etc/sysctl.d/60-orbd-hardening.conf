# orbd: what an unprivileged process in an orb may see of, or do to, the kernel and other
# processes (README, "Inside an orb"). Root keeps dmesg, `gdb -p` and the rest, and
# Amp's `user` has passwordless sudo (`sudo dmesg` works as before), so these bind
# processes that cannot use sudo, e.g. in a no_new_privs sandbox. A later file
# (99-*.conf) or `sudo sysctl -w` overrides them, except unprivileged eBPF: once off, it
# stays off until a reboot, so turning it on means editing this file.

# Yama: ptrace, /proc/<pid>/mem, process_vm_readv/writev and pidfd_getfd only on a
# descendant, so a tool cannot attach to the agent that started it or to a sibling.
# `gdb ./prog`, `strace cmd` and tracing a child still work. orbd's kernel boots with it.
kernel.yama.ptrace_scope = 1

# Kernel addresses in /proc/kallsyms and %pK files read as 0 without CAP_SYSLOG: they
# would undo KASLR for a kernel exploit.
kernel.kptr_restrict = 1

# The kernel log (dmesg, /dev/kmsg) needs CAP_SYSLOG: it holds kernel addresses and
# other processes' names, crashes and OOM kills. orbd's kernel boots with it.
kernel.dmesg_restrict = 1

# No eBPF without CAP_BPF or CAP_SYS_ADMIN, and root cannot turn it back on without a
# reboot (orbd's kernel boots with 2, which root may set to 0). Unprivileged eBPF is
# where most BPF verifier exploits start. seccomp filters are classic BPF and unaffected,
# and so are root's programs (Docker's and systemd's cgroup filters, bpftrace via sudo).
kernel.unprivileged_bpf_disabled = 1

# Constant blinding in the BPF JIT for every program, root's included, against JIT
# spraying. It costs a little JIT time on the small programs Docker and systemd load.
net.core.bpf_jit_harden = 2

# A process that changed credentials (a setuid program such as sudo, or one that called
# setuid()) is never dumped into a core file its unprivileged user could read. The
# kernel's default, set in case an image installs systemd-coredump, whose
# 50-coredump.conf raises it to 2.
fs.suid_dumpable = 0

# TIOCSTI needs CAP_SYS_ADMIN, so a sandboxed process sharing a terminal with the shell
# that started it (e.g. bwrap without --new-session) cannot type commands into that
# shell. orbd's kernel boots with it.
dev.tty.legacy_tiocsti = 0
